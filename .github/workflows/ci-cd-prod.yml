name: CI/CD — Prod (Auto-deploy on PR merge)

# Triggers automatically when a PR is merged into prod.
# No workflow_dispatch — no separate human action required after PR approval.
on:
  push:
    branches: [ prod ]

env:
  BACKEND_IMAGE: mrkolincechatgpt/chat-backend
  FRONTEND_IMAGE: mrkolincechatgpt/chat-frontend

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & type-check — Backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck

      - name: Build — Backend
        working-directory: backend
        run: npm run build

      - name: Install & lint — Frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint

      - name: Build — Frontend
        working-directory: frontend
        run: npm run build

  deploy-prod:
    name: Deploy to Production (automatic)
    runs-on: ubuntu-latest
    needs: ci
    # No condition — always runs when CI passes on prod branch push (after PR merge)
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag (prod-sha format)
        id: tag
        run: echo "TAG=prod-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend PROD optimized image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.TAG }}
            ${{ env.BACKEND_IMAGE }}:prod-latest

      - name: Build & push frontend PROD optimized image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.TAG }}
            ${{ env.FRONTEND_IMAGE }}:prod-latest

      - name: Update prod manifests with new image tag and commit
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          sed -i "s|image: mrkolincechatgpt/chat-backend:.*|image: mrkolincechatgpt/chat-backend:${TAG}|g" \
            k8s/prod/backend/deployment.yaml
          sed -i "s|image: mrkolincechatgpt/chat-frontend:.*|image: mrkolincechatgpt/chat-frontend:${TAG}|g" \
            k8s/prod/frontend/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/prod/
          git diff --staged --quiet || git commit -m "deploy(prod): image tag ${TAG} [skip ci]"
          git push

      - name: Deploy to prod namespace via kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -f k8s/prod/
          kubectl rollout status deployment/chat-backend -n chat-prod --timeout=180s
          kubectl rollout status deployment/chat-frontend -n chat-prod --timeout=180s
          echo "Prod deploy complete — image tag: ${{ steps.tag.outputs.TAG }}"
          echo "ArgoCD will also reconcile within ~3 minutes via automated sync"
