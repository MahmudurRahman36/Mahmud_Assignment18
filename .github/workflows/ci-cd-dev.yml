name: CI/CD — Dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy to dev"
        required: false
        default: "Manual deploy triggered by engineer"

env:
  BACKEND_IMAGE: mrkolincechatgpt/chat-backend
  FRONTEND_IMAGE: mrkolincechatgpt/chat-frontend

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & type-check — Backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck

      - name: Build — Backend
        working-directory: backend
        run: npm run build

      - name: Install & lint — Frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint

      - name: Build — Frontend
        working-directory: frontend
        run: npm run build

  deploy-dev:
    name: Deploy to Dev (manual trigger only)
    runs-on: ubuntu-latest
    needs: ci
    # KEY: only runs when a human explicitly clicks "Run workflow" in Actions tab
    if: github.event_name == 'workflow_dispatch'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag (env-sha format)
        id: tag
        run: echo "TAG=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend dev image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.dev
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.TAG }}
            ${{ env.BACKEND_IMAGE }}:dev-latest

      - name: Build & push frontend dev image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.dev
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.TAG }}
            ${{ env.FRONTEND_IMAGE }}:dev-latest

      - name: Update K8s manifests with new image tag
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          sed -i "s|image: mrkolincechatgpt/chat-backend:.*|image: mrkolincechatgpt/chat-backend:${TAG}|g" \
            k8s/dev/backend/deployment.yaml
          sed -i "s|image: mrkolincechatgpt/chat-frontend:.*|image: mrkolincechatgpt/chat-frontend:${TAG}|g" \
            k8s/dev/frontend/deployment.yaml

      - name: Deploy to dev namespace via kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -f k8s/dev/
          kubectl rollout status deployment/chat-backend -n chat-dev --timeout=120s
          kubectl rollout status deployment/chat-frontend -n chat-dev --timeout=120s
          echo "Dev deploy complete — image tag: ${{ steps.tag.outputs.TAG }}"
