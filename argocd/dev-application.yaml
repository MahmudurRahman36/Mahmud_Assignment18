apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/MahmudurRahman36/Mahmud_Assignment18.git
    targetRevision: dev
    path: k8s/dev
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: chat-dev

  # Manual sync — ArgoCD watches and shows drift but does NOT auto-apply.
  # A human must click Sync in the ArgoCD UI or run: argocd app sync chat-dev
  syncPolicy: {}
